log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.4.4;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol bgp r17 {
    description "BGP to R17";
    local 10.0.4.4 as 65004;
    neighbor 10.0.17.17 as 65017;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

