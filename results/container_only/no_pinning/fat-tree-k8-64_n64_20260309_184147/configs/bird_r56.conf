log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.56.56;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol static static4 {
    ipv4;
    route 192.168.56.0/24 blackhole;
}

protocol bgp r29 {
    description "BGP to R29";
    local 10.0.56.56 as 65056;
    neighbor 10.0.29.29 as 65029;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

