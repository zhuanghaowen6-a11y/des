log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.30.30;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol static static4 {
    ipv4;
    route 192.168.30.0/24 blackhole;
}

protocol bgp r10 {
    description "BGP to R10";
    local 10.0.30.30 as 65030;
    neighbor 10.0.10.10 as 65010;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

protocol bgp r11 {
    description "BGP to R11";
    local 10.0.30.30 as 65030;
    neighbor 10.0.11.11 as 65011;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

protocol bgp r12 {
    description "BGP to R12";
    local 10.0.30.30 as 65030;
    neighbor 10.0.12.12 as 65012;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

