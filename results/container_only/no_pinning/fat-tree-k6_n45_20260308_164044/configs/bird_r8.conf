log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.8.8;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol bgp r12 {
    description "BGP to R12";
    local 10.0.8.8 as 65008;
    neighbor 10.0.12.12 as 65012;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

