log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.12.12;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol bgp r7 {
    description "BGP to R7";
    local 10.0.12.12 as 65012;
    neighbor 10.0.7.7 as 65007;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

