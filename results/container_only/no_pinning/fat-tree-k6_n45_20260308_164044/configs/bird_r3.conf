log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.3.3;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol bgp r10 {
    description "BGP to R10";
    local 10.0.3.3 as 65003;
    neighbor 10.0.10.10 as 65010;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

