log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.31.31;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol static static4 {
    ipv4;
    route 192.168.31.0/24 blackhole;
}

protocol bgp r13 {
    description "BGP to R13";
    local 10.0.31.31 as 65031;
    neighbor 10.0.13.13 as 65013;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

protocol bgp r14 {
    description "BGP to R14";
    local 10.0.31.31 as 65031;
    neighbor 10.0.14.14 as 65014;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

protocol bgp r15 {
    description "BGP to R15";
    local 10.0.31.31 as 65031;
    neighbor 10.0.15.15 as 65015;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

