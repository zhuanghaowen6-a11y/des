log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.14.14;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol bgp r20 {
    description "BGP to R20";
    local 10.0.14.14 as 65014;
    neighbor 10.0.20.20 as 65020;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

