log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.59.59;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol static static4 {
    ipv4;
    route 192.168.59.0/24 blackhole;
}

protocol bgp r33 {
    description "BGP to R33";
    local 10.0.59.59 as 65059;
    neighbor 10.0.33.33 as 65033;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

