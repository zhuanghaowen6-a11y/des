log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.64.64;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol static static4 {
    ipv4;
    route 192.168.64.0/24 blackhole;
}

protocol bgp r37 {
    description "BGP to R37";
    local 10.0.64.64 as 65064;
    neighbor 10.0.37.37 as 65037;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

