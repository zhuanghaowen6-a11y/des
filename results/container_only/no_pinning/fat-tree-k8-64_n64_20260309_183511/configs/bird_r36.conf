log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.36.36;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol bgp r13 {
    description "BGP to R13";
    local 10.0.36.36 as 65036;
    neighbor 10.0.13.13 as 65013;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

