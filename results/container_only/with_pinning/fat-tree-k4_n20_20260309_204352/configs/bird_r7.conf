log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.7.7;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol static static4 {
    ipv4;
    route 192.168.7.0/24 blackhole;
}

protocol bgp r1 {
    description "BGP to R1";
    local 10.0.7.7 as 65007;
    neighbor 10.0.1.1 as 65001;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

protocol bgp r2 {
    description "BGP to R2";
