log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.46.46;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol static static4 {
    ipv4;
    route 192.168.46.0/24 blackhole;
}

protocol bgp r21 {
    description "BGP to R21";
    local 10.0.46.46 as 65046;
    neighbor 10.0.21.21 as 65021;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

protocol bgp r22 {
    description "BGP to R22";
