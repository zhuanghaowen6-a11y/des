log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.5.5;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol bgp r18 {
    description "BGP to R18";
    local 10.0.5.5 as 65005;
    neighbor 10.0.18.18 as 65018;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

