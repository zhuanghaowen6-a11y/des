log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.11.11;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol bgp r19 {
    description "BGP to R19";
    local 10.0.11.11 as 65011;
    neighbor 10.0.19.19 as 65019;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

