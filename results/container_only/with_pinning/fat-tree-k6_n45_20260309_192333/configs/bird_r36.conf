log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.36.36;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol static static4 {
    ipv4;
    route 192.168.36.0/24 blackhole;
}

protocol bgp r16 {
    description "BGP to R16";
    local 10.0.36.36 as 65036;
    neighbor 10.0.16.16 as 65016;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

protocol bgp r17 {
    description "BGP to R17";
    local 10.0.36.36 as 65036;
    neighbor 10.0.17.17 as 65017;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

protocol bgp r18 {
    description "BGP to R18";
    local 10.0.36.36 as 65036;
    neighbor 10.0.18.18 as 65018;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

