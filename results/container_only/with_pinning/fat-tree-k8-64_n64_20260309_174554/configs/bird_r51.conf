log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.51.51;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol static static4 {
    ipv4;
    route 192.168.51.0/24 blackhole;
}

protocol bgp r25 {
    description "BGP to R25";
    local 10.0.51.51 as 65051;
    neighbor 10.0.25.25 as 65025;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

protocol bgp r26 {
    description "BGP to R26";
