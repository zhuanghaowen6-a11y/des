log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.18.18;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol static static4 {
    ipv4;
    route 192.168.18.0/24 blackhole;
}

protocol bgp r9 {
    description "BGP to R9";
    local 10.0.18.18 as 65018;
    neighbor 10.0.9.9 as 65009;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

protocol bgp r10 {
    description "BGP to R10";
    local 10.0.18.18 as 65018;
    neighbor 10.0.10.10 as 65010;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

