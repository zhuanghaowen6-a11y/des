log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.37.37;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol static static4 {
    ipv4;
    route 192.168.37.0/24 blackhole;
}

protocol bgp r19 {
    description "BGP to R19";
    local 10.0.37.37 as 65037;
    neighbor 10.0.19.19 as 65019;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

protocol bgp r20 {
    description "BGP to R20";
    local 10.0.37.37 as 65037;
    neighbor 10.0.20.20 as 65020;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

protocol bgp r21 {
    description "BGP to R21";
    local 10.0.37.37 as 65037;
    neighbor 10.0.21.21 as 65021;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

