log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.15.15;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol static static4 {
    ipv4;
    route 192.168.15.0/24 blackhole;
}

protocol bgp r7 {
    description "BGP to R7";
    local 10.0.15.15 as 65015;
    neighbor 10.0.7.7 as 65007;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

protocol bgp r8 {
    description "BGP to R8";
    local 10.0.15.15 as 65015;
    neighbor 10.0.8.8 as 65008;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

