log stderr all;
debug protocols { states, routes, filters, interfaces, events };

router id 10.0.4.4;

protocol device {
    scan time 10;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol kernel {
    ipv4 {
        export all;
    };
    merge paths on;
}

protocol static static4 {
    ipv4;
    route 192.168.4.0/24 blackhole;
}

protocol bgp r6 {
    description "BGP to R6";
    local 10.0.4.4 as 65004;
    neighbor 10.0.6.6 as 65006;
    
    ipv4 {
        import all;
        export where source ~ [ RTS_STATIC, RTS_BGP ];
    };
    
    hold time 180;
    keepalive time 60;
    connect retry time 5;
}

protocol bgp r8 {
    description "BGP to R8";
