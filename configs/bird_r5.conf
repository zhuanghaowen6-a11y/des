log syslog all;
debug protocols all;

router id 10.100.5.5;

protocol device {
    scan time 10;
}

protocol kernel {
    ipv4 {
        import all;
        export all;
    };
}

protocol static static4 {
    ipv4;
    route 192.168.5.0/24 blackhole;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol bgp r1 {
    local 10.100.5.5 as 65005;
    neighbor 10.100.1.1 as 65001;
    ipv4 {
        import all;
        export all;
    };
    connect retry time 5;
}

protocol bgp r2 {
    local 10.100.5.5 as 65005;
    neighbor 10.100.2.2 as 65002;
    ipv4 {
        import all;
        export all;
    };
    connect retry time 5;
}

protocol bgp r3 {
    local 10.100.5.5 as 65005;
    neighbor 10.100.3.3 as 65003;
    ipv4 {
        import all;
        export all;
    };
    connect retry time 5;
}

protocol bgp r4 {
    local 10.100.5.5 as 65005;
    neighbor 10.100.4.4 as 65004;
    ipv4 {
        import all;
        export all;
    };
    connect retry time 5;
}

