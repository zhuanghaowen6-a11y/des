log syslog all;
debug protocols all;

router id 10.100.1.1;

protocol device {
    scan time 10;
}

protocol kernel {
    ipv4 {
        import all;
        export all;
    };
}

protocol static static4 {
    ipv4;
    route 192.168.1.0/24 blackhole;
}

protocol direct {
    ipv4;
    interface "eth*";
}

protocol bgp r2 {
    local 10.100.1.1 as 65001;
    neighbor 10.100.2.2 as 65002;
    ipv4 {
        import all;
        export all;
    };
    connect retry time 5;
}

